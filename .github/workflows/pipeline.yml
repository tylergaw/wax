name: Update collection data

on:
  schedule:
    # 9:00 UTC is 5 AM Eastern during daylight time, 4 AM in winter
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Which records to send to Claude
        type: choice
        options:
          - new
          - no-color
          - all
        default: new

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'new' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # The pipeline scripts load pipeline/.env, which only exists locally
      - run: touch pipeline/.env

      - name: Fetch collection from Discogs
        run: yarn pipeline:fetch:skipPrompt
        env:
          TOKEN: ${{ secrets.TOKEN }}
          USERNAME: ${{ secrets.USERNAME }}

      - name: Fetch album years from Discogs
        run: yarn pipeline:masters
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - name: Fetch album covers
        run: yarn pipeline:covers
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Enrich with Claude
        run: yarn pipeline:enrich --mode="$MODE"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Routine runs merge themselves. no-color and all runs wait for review.
      - name: Open a PR if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."
            exit 0
          fi

          branch="data-update-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data
          git commit -m "Updates collection data"
          git push -u origin "$branch"

          git show HEAD~1:data/collection.json > "$RUNNER_TEMP/before.json"
          {
            echo "Automated pipeline run, mode: $MODE."
            echo
            (cd pipeline && node ./src/describeChanges.js "$RUNNER_TEMP/before.json" ../data/collection.json)
          } > "$RUNNER_TEMP/body.md"

          gh pr create \
            --title "Updates collection data ($MODE)" \
            --body-file "$RUNNER_TEMP/body.md"

          if [ "$MODE" = "new" ]; then
            merged=false
            for attempt in 1 2 3 4 5; do
              if gh pr merge "$branch" --squash; then
                merged=true
                break
              fi
              sleep 5
            done

            if [ "$merged" != true ]; then
              echo "Couldn't merge the PR, leaving it open."
              exit 1
            fi

            git push origin --delete "$branch"
          fi
